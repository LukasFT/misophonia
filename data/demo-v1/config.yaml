dataset_splits:
  train: &train
    from_premade: "true"
    generated_config:
  val:
    <<: *train
  test:
    <<: *train

batch_size: 2

model_params:
  label_len: 10
  L: 8  # noqa: N803 # TODO: Improve name?
  model_dim: 128
  num_enc_layers: 1
  dec_buf_len: 100
  num_dec_layers: 1
  dec_chunk_size: 72
  out_buf_len: 2
  use_pos_enc: True
  conditioning: "mult"
  lookahead: True

mlflow_experiment: "demo-v1"
