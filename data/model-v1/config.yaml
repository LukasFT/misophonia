dataset_splits:
  train:
    # from_premade: true
    generated_config: &generate_train
      num_samples: 20000 
      trig_to_control_ratio: 0.95 # 95% triggers, 5% controls
      backgrounds_per_item: [1, 6]

  val:
    generated_config:
      <<: *generate_train
      num_samples: 7000
  test:
    generated_config:
      <<: *generate_train
      num_samples: 3000
  
batch_size: 8
num_epochs : 50

model_params:
  label_len: 8

model_hyperparams:
  lr: 0.0005
  weight_decay: 0

mlflow_experiment: "model-v1"